@import helper._
@(idAy: Long)(implicit request: Http.Request)

<form method="POST" name="photoAyForm" id="photoAyForm"
      action="@controllers.routes.AyantDroitCtrl.formProfilSave() "
      class="form-horizontal" role="form" enctype="multipart/form-data">
	@helper.CSRF.formField
	<input value="@idAy" name="id-ay" type="hidden">

	<div class="form-group">
		<label for="photo"><b>Choisir une photo <font style="color:red;">*</font></b></label>
		<input type="file" id="photo" name="photo" class="form-control" accept="image/*" required="required">
	</div>

	<div id="photoAyFormError" class="alert alert-danger d-none"></div>
</form>
